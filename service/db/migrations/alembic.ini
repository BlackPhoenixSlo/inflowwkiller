# Alembic config for the relay. Most knobs left at defaults; the
# script_location + sqlalchemy.url are filled programmatically by
# service/db/engine.py:init_db() so this file is mainly for the
# `alembic` CLI when you want to inspect / generate migrations by hand.

[alembic]
# Resolve relative to this alembic.ini file (not the CWD), so the CLI works
# from any directory: `alembic -c service/db/migrations/alembic.ini ...`.
script_location = %(here)s
sqlalchemy.url = sqlite:///service/chatterly.db

# Filename template includes a unix timestamp prefix so migrations sort
# chronologically even when generated on different machines.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Revisions live in versions/ so the alembic CLI doesn't try to load
# env.py / script.py.mako as version files (it scans every .py in
# version_locations). Keeping env.py at script_location root is required
# by Alembic; only the revision files needed to move down a level.
version_locations = %(here)s/versions

[post_write_hooks]
# Empty; we don't auto-format generated migrations.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
