<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Chat</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4166f6;
  --blue-soft:rgba(65,102,246,.16);
  --blue-txt:#7d97ff;
  --green:#67d1ae;
  --panel:#232323;
  --thread:#151515;
  --hover:#353535;
  --border:#333;
  --text:#ffffff;
  --muted:#8a8a8a;
  --muted2:#6f6f6f;
  --coral:#ef5a4a;
  --topbar:#171717;
  --win:#0d0d0d;
  --pink:#ec4b9b;
  --pink-soft:rgba(236,75,155,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--win);color:var(--text);
  font-size:14px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
svg{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100vh;width:100vw;overflow:hidden}

/* ===== TOP STRIP ===== */
.topstrip{
  height:46px;min-height:46px;background:var(--topbar);
  display:flex;align-items:center;gap:14px;padding:0 14px;
  border-bottom:1px solid #0c0c0c;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .gicon{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4166f6,#7b5cc0);
  display:grid;place-items:center;flex:none}
.brand .gicon svg{width:15px;height:15px;color:#fff}
.brand .btitle{font-weight:700;font-size:14px;white-space:nowrap}
.brand .bsub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.count-pill{display:inline-flex;align-items:center;gap:6px;background:#262626;border:1px solid var(--border);
  border-radius:8px;padding:6px 11px;color:#cfcfcf;font-size:12.5px;font-weight:600;white-space:nowrap}
.count-pill b{color:#fff}
.count-pill.full b{color:var(--pink)}
.btn-add{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;font-weight:700;
  font-size:13.5px;padding:9px 16px;border-radius:9px;white-space:nowrap}
.btn-add:hover{background:#3556e0}
.btn-add:disabled{background:#2c2c2c;color:#6f6f6f;cursor:not-allowed}
.btn-add svg{width:16px;height:16px}
.link-msgs{display:inline-flex;align-items:center;gap:6px;color:#cfcfcf;font-size:13px;font-weight:600;
  padding:7px 10px;border-radius:8px;text-decoration:none}
.link-msgs:hover{background:#262626}
.link-msgs svg{width:16px;height:16px;color:var(--muted)}

/* ===== HOME TAB ROW ===== */
.hometabs{height:34px;min-height:34px;background:var(--topbar);display:flex;align-items:flex-end;gap:4px;
  padding:0 14px;border-bottom:1px solid var(--border)}
.htab{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#cfcfcf;
  background:transparent;padding:6px 16px;border-radius:8px 8px 0 0;text-decoration:none;cursor:pointer}
.htab svg{width:15px;height:15px;color:var(--muted)}
.htab:hover{background:#202020}
.htab.active{background:var(--panel);color:#fff}
.htab.active svg{color:var(--blue)}

/* ===== GRID ===== */
.gridwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 78px;
  display:grid;gap:12px;align-content:stretch;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));
  grid-auto-rows:minmax(300px,1fr)}
.gridwrap.is-empty{display:block;padding:14px 14px 78px}

/* ===== PANE ===== */
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--thread);
  border:1px solid var(--border);border-radius:12px;overflow:hidden}
.pane-head{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--border);
  background:var(--panel)}
.pane-av{width:32px;height:32px;border-radius:50%;background:#3a3a3a;flex:none;position:relative;
  display:grid;place-items:center;font:800 12px Inter,sans-serif;color:#fff;overflow:hidden}
.pane-av>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.pane-id{flex:1;min-width:0}
.pane-name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-cre{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pane-cre i{width:7px;height:7px;border-radius:50%;background:var(--pink);flex:none}
.pane-open{color:var(--muted);width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:6px}
.pane-open:hover{background:#2c2c2c;color:#cfcfcf}
.pane-open svg{width:15px;height:15px}
.pane-x{color:var(--muted2);width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:6px;
  font-size:18px;line-height:1}
.pane-x:hover{background:#2c2c2c;color:#fff}

.pane-body{flex:1;min-height:0;overflow-y:auto;padding:12px 12px;display:flex;flex-direction:column;gap:7px}
.pane-state{color:var(--muted);font-size:12px;text-align:center;padding:16px 8px;margin:auto 0}
.pane-state.err{color:var(--coral)}

.gb{max-width:86%;padding:8px 11px;border-radius:13px;font-size:13px;line-height:1.42;width:fit-content;
  word-break:break-word;white-space:pre-wrap}
.gb.in{background:#2b2b2b;color:#f2f2f2;border-bottom-left-radius:5px;align-self:flex-start}
.gb.out{background:var(--blue);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.gb .chips{margin-top:5px;display:flex;gap:8px;font-size:11px}
.gb.in .chips{color:var(--muted)}
.gb.out .chips{color:rgba(255,255,255,.8)}
.gb .btime{display:block;font-size:10.5px;opacity:.55;margin-top:4px}

.pane-comp{border-top:1px solid var(--border);background:var(--panel);padding:9px;display:flex;
  align-items:flex-end;gap:8px}
.pane-comp textarea{flex:1;min-width:0;resize:none;background:var(--thread);border:1px solid var(--border);
  border-radius:8px;color:#eee;padding:8px 10px;font:13px/1.4 Inter,sans-serif;max-height:96px;outline:none}
.pane-comp textarea:focus{border-color:var(--blue)}
.pane-comp textarea::placeholder{color:#5f5f5f}
.pane-send{flex:none;background:var(--blue);color:#fff;font-weight:700;font-size:12.5px;padding:9px 16px;
  border-radius:8px}
.pane-send:disabled{background:#2c2c2c;color:#6f6f6f;cursor:not-allowed}
.pane-send:not(:disabled):hover{background:#3556e0}
.pane-foot{padding:5px 11px;font-size:10px;color:var(--muted2);background:var(--panel);
  border-top:1px solid rgba(51,51,51,.5);display:flex;align-items:center;justify-content:space-between}

/* ===== EMPTY STATE ===== */
.empty{height:100%;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;text-align:center;padding:24px}
.empty .eicon{width:88px;height:88px;border-radius:22px;background:#191919;border:1px solid var(--border);
  display:grid;place-items:center}
.empty .eicon svg{width:44px;height:44px;color:#3d63f0}
.empty h2{margin:0;font-size:20px;font-weight:700}
.empty p{margin:0;max-width:420px;color:var(--muted);font-size:13.5px;line-height:1.55}
.empty .btn-add{font-size:15px;padding:12px 22px}

/* ===== ADD SHEET ===== */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.64);z-index:9993;display:flex;
  align-items:center;justify-content:center}
.sheet{background:#1c1c1c;border:1px solid var(--border);border-radius:14px;width:min(560px,94vw);
  max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);
  font-weight:700;font-size:14px}
.sheet-h .step{color:var(--muted);font-weight:600;font-size:12px}
.sheet-h .x{margin-left:auto;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.sheet-h .x:hover{background:#2a2a2a;color:#fff}
.sheet-h .bk{color:var(--blue);cursor:pointer;font-size:12.5px;font-weight:600}
.sheet-b{padding:8px;overflow:auto;min-height:120px}
.pick{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:9px;cursor:pointer}
.pick:hover{background:#262626}
.pick .pav{width:34px;height:34px;border-radius:8px;background:#3a3a3a;flex:none;position:relative;
  display:grid;place-items:center;font:800 12px Inter,sans-serif;overflow:hidden}
.pick .pav.rnd{border-radius:50%}
.pick .pav>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.pick .pav i{position:absolute;bottom:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--pink)}
.pick .pmain{flex:1;min-width:0}
.pick .pnm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .psub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pick .pmeta{color:var(--muted2);font-size:11px;flex:none}
.pick.dim{opacity:.5;cursor:default}
.pick.dim:hover{background:none}
.sheet-note{padding:14px 16px;color:var(--muted);font-size:12.5px;line-height:1.55}
.sheet-note b{color:#d6d6d6}
.sheet-search{padding:8px 10px 4px}
.sheet-search input{width:100%;background:var(--thread);border:1px solid var(--border);border-radius:8px;
  color:#eee;padding:9px 11px;font:13px Inter,sans-serif;outline:none}
.sheet-search input:focus{border-color:var(--blue)}

/* ===== PANE PICKERS (vault / gif / emoji) ===== */
.pane-att{display:flex;gap:6px;flex-wrap:wrap;padding:7px 9px 0}
.pane-att:empty{display:none}
.pane-att .a{position:relative;width:40px;height:40px;border-radius:7px;overflow:hidden;border:1px solid #383838;background:#111;flex:none}
.pane-att .a img{width:100%;height:100%;object-fit:cover;display:block}
.pane-att .a.gif{display:grid;place-items:center;font-size:10px;font-weight:800;color:#cfcfcf}
.pane-att .a b{position:absolute;top:0;right:0;background:rgba(0,0,0,.75);font-size:10px;padding:0 4px;cursor:pointer;border-bottom-left-radius:5px}
.pane-tools{display:flex;align-items:center;gap:2px;padding:6px 9px 0}
.ptool{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#a9a9a9;flex:none}
.ptool:hover{background:#2c2c2c;color:#fff}
.ptool svg{width:17px;height:17px}
.ptool .cnt{position:absolute;top:-3px;right:-3px;background:var(--pink);color:#fff;font-size:9px;font-weight:800;
  min-width:14px;height:14px;border-radius:7px;display:grid;place-items:center;padding:0 3px}
.ptool{position:relative}
.gmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.gmgrid .mt{position:relative;border-radius:9px;overflow:hidden;background:#111;aspect-ratio:1;border:1px solid #2e2e2e;cursor:pointer}
.gmgrid .mt img{width:100%;height:100%;object-fit:cover;display:block}
.gmgrid .mt.sel{outline:2px solid var(--pink);outline-offset:-2px}
.gmgrid .mt .tag{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.7);border-radius:6px;padding:2px 6px;font-size:10px;font-weight:700}
.gmgrid .mt .vplay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.55);display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.85);z-index:2}
.gmgrid .mt .vplay:hover{background:var(--blue)}
.gmgrid .mt .vplay svg{width:15px;height:15px;margin-left:2px;color:#fff}
.gmgrid .mt .vdur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.72);border-radius:6px;padding:2px 5px;font-size:10px;font-weight:700}
.gmgrid .mt .vlock{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.7);border-radius:6px;padding:1px 4px;font-size:10px}
.gmgrid .mt .vt-dot{position:absolute;top:5px;left:5px;width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.gmgrid .mt .vt-own,.gmgrid .mt .vt-sent{position:absolute;top:5px;left:5px;border-radius:6px;padding:1px 6px;font-size:9px;font-weight:800;line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.gmgrid .mt .vt-own{background:rgba(61,220,132,.95);color:#053017}
.gmgrid .mt .vt-sent{background:rgba(255,196,64,.95);color:#3a2a00}
.gmgrid .mt .vcap{position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:5px;background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.45) 55%,transparent)}
.gmgrid .mt .vcap p{margin:0;color:#fff;font-size:9px;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.95);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gmgrid .mt .vcap-tags{display:flex;flex-wrap:wrap;gap:2px}
.gmgrid .mt .vcap-tags span{background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:0 4px;font-size:7.5px;line-height:1.5}
.gmgrid .mt.vhovering{outline:2px solid var(--blue);outline-offset:-2px}
.gmgrid .mt .vhover-cd{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.74);color:#fff;font:700 10px Inter,sans-serif;padding:3px 8px;border-radius:10px;z-index:3;pointer-events:none;display:inline-flex;align-items:center;gap:4px}
.gmgrid .mt .vhover-cd::before{content:'';width:8px;height:8px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:gvspin .7s linear infinite}
@keyframes gvspin{to{transform:rotate(360deg)}}
.gvtb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.gvtb .vseg{display:inline-flex;background:#151515;border:1px solid #2e2e2e;border-radius:8px;padding:2px}
.gvtb .vseg button{border:0;background:transparent;color:var(--muted,#9a9a9a);font:600 11px Inter,sans-serif;padding:4px 9px;border-radius:6px;cursor:pointer}
.gvtb .vseg button.on{background:#2a2a2a;color:#fff}
.gvtb select,.gvtb input{background:#151515;border:1px solid #2e2e2e;border-radius:7px;color:#eee;font:11px Inter,sans-serif;padding:5px 8px}
.gvtb input[type=search]{min-width:110px}
.gvtb .vcap-tog{display:inline-flex;align-items:center;gap:4px;border:1px solid #2e2e2e;background:#151515;color:var(--muted,#9a9a9a);border-radius:999px;padding:4px 9px;font:600 10.5px Inter,sans-serif;cursor:pointer}
.gvtb .vcap-tog.on{border-color:var(--pink);color:var(--pink);background:rgba(255,64,129,.08)}
.gvtb .vcached{margin-left:auto;color:#3ddc84;font:600 10px Inter,sans-serif}
.gvchips{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:8px;font-size:11px}
.gvchips .vlbl{color:var(--muted2,#6a6a6a)}
.gvchips .vchip{border:1px solid #2e2e2e;background:#181818;color:#cfcfcf;border-radius:999px;padding:3px 9px;cursor:pointer;font-weight:600}
.gvchips .vchip.on{border-color:var(--blue);background:rgba(65,102,246,.14);color:#fff}
.gvchips .vchip .st{color:var(--pink);margin-right:2px}
.gvcap-hint{color:var(--muted,#9a9a9a);font-size:11px;background:#1a1a1a;border:1px dashed #333;border-radius:8px;padding:6px 9px;margin-bottom:8px}
.gvmore-row{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0 2px;color:var(--muted,#9a9a9a);font-size:11.5px}
.gvfolders{display:flex;flex-direction:column;gap:8px}
.gvf{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid #2e2e2e;border-radius:10px;background:#181818;cursor:pointer}
.gvf:hover{background:#212121}
.gvf .ic{width:34px;height:34px;border-radius:8px;background:#242424;display:grid;place-items:center;color:var(--pink);flex:none}
.gvf .ic svg{width:18px;height:18px}
.gvf .nm{font-weight:600;font-size:13.5px}
.gvf .ct{color:var(--muted);font-size:12px;margin-top:1px}
.gvcrumb{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:#cfcfcf}
.gvcrumb .bk{display:inline-flex;align-items:center;gap:6px;color:var(--blue-txt);cursor:pointer;font-weight:600;padding:5px 10px;border:1px solid #333;border-radius:8px}
.gvcrumb .bk svg{width:14px;height:14px}
.gnote{color:var(--muted);font-size:12.5px;line-height:1.5;padding:10px 2px}
.emoji-pop{position:fixed;z-index:9995;background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:8px;
  display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 12px 34px rgba(0,0,0,.55);width:288px}
.emoji-pop button{font-size:19px;width:32px;height:32px;border-radius:7px}
.emoji-pop button:hover{background:#2c2c2c}
.gvid-back{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9997;display:flex;align-items:center;justify-content:center;padding:24px}
.gvid-back video,.gvid-back #gvpFrame{max-width:88vw;max-height:80vh;border-radius:12px;background:#000;display:block}
.gvid-x{position:absolute;top:14px;right:18px;width:36px;height:36px;border-radius:50%;background:#1c1c1c;border:1px solid #3a3a3a;color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer}
.gvid-note{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#c9c9c9;font-size:12.5px;padding:0 24px}
</style>
</head>
<body>
<div class="app">

  <!-- ===== TOP STRIP ===== -->
  <div class="topstrip">
    <div class="brand">
      <span class="gicon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 20c0-2.8 1.8-5 4.5-5"/></svg>
      </span>
      <span>
        <div class="btitle">Group chat</div>
        <div class="bsub" id="brandSub">Multi-chat across creators</div>
      </span>
    </div>
    <div class="top-right">
      <a class="link-msgs" href="messages.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 8l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
        Messages
      </a>
      <span class="count-pill" id="countPill"><b id="countN">0</b> / 8 open</span>
      <button class="btn-add" id="btnAdd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Add chat
      </button>
    </div>
  </div>

  <!-- ===== HOME TAB ROW ===== -->
  <div class="hometabs">
    <a class="htab" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Home
    </a>
    <a class="htab" href="messages.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 8l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
      Messages
