<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Infloww · Messages Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F6F8FB;
    --panel:#FFFFFF;
    --border:#E6EAF2;
    --accent:#2F6BFF;
    --accent-2:#1E4FD6;
    --tint:#EAF1FF;
    --heading:#12172B;
    --muted:#5B6478;
    --muted-2:#8A92A6;
    --success:#16B364;
    --success-tint:#E6F7EE;
    --warning:#F5A623;
    --warning-tint:#FEF3E0;
    --navy:#12172B;
    --navy-2:#1B2138;
    --pink:#F0518A;
    --violet:#8B5CF6;
    --shadow-sm:0 1px 2px rgba(18,23,43,.05);
    --shadow-md:0 6px 18px rgba(18,23,43,.08);
    --shadow-lg:0 12px 34px rgba(18,23,43,.12);
    --r-sm:8px;
    --r-md:10px;
    --r-lg:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--heading);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#D3DAE8;border-radius:20px;border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:#B9C2D6;background-clip:content-box;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ============ APP SHELL ============ */
  .app{display:flex;flex-direction:column;height:100vh;width:100vw;overflow:hidden;}

  /* Top toolbar */
  .topbar{
    height:44px;flex:0 0 44px;display:flex;align-items:center;gap:14px;
    padding:0 16px 0 16px;background:var(--panel);border-bottom:1px solid var(--border);
    z-index:20;
  }
  .topbar .brand-wrap{display:flex;align-items:center;gap:9px;min-width:64px;}
  .topbar .crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:500;}
  .topbar .crumb strong{color:var(--heading);font-weight:600;}
  .topbar .crumb .sep{color:#C7CEDD;}
  .topbar-spacer{flex:1;}
  .status-toggle{
    display:flex;align-items:center;gap:8px;padding:5px 11px;border-radius:20px;
    background:var(--success-tint);color:#0E8F4F;font-weight:600;font-size:12px;border:1px solid #CFF0DE;
  }
  .status-toggle .switch{
    width:30px;height:17px;border-radius:20px;background:var(--success);position:relative;flex:0 0 auto;
  }
  .status-toggle .switch::after{content:"";position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);}
  .topbar-icons{display:flex;align-items:center;gap:4px;}
  .tb-btn{
    width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);position:relative;transition:.15s;
  }
  .tb-btn:hover{background:var(--bg);color:var(--heading);}
  .tb-btn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--pink);border:1.5px solid #fff;}
  .tb-search{
    display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);
    border-radius:9px;padding:6px 11px;width:220px;color:var(--muted-2);font-size:12.5px;
  }
  .tb-search input{border:none;background:none;outline:none;flex:1;color:var(--heading);font-size:12.5px;}
  kbd{font-family:inherit;font-size:10.5px;background:#fff;border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--muted-2);box-shadow:0 1px 0 var(--border);}

  /* Body row */
  .body-row{flex:1;display:flex;min-height:0;}

  /* ============ ICON RAIL ============ */
  .rail{
    width:64px;flex:0 0 64px;background:var(--navy);display:flex;flex-direction:column;align-items:center;
    padding:12px 0 12px;gap:4px;
  }
  .rail .logo{
    width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2F6BFF,#6A9BFF);
    display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 6px 16px rgba(47,107,255,.45);
  }
  .rail-nav{display:flex;flex-direction:column;gap:3px;flex:1;width:100%;align-items:center;}
  .nav-item{
    width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    color:#8891AC;position:relative;transition:.16s;
  }
  .nav-item:hover{background:var(--navy-2);color:#DCE3F5;}
  .nav-item.active{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(47,107,255,.4);}
  .nav-item.active::before{content:"";position:absolute;left:-12px;width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--accent);}
  .nav-item .badge{
    position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--pink);
    color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--navy);
  }
  .rail-tip{
    position:absolute;left:58px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:7px;
    white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-4px);transition:.14s;z-index:40;box-shadow:var(--shadow-md);
  }
  .nav-item:hover .rail-tip{opacity:1;transform:translateX(0);}
  .rail .me{
    width:36px;height:36px;border-radius:50%;margin-top:8px;background:linear-gradient(135deg,#F0518A,#8B5CF6);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;
    border:2px solid var(--navy-2);cursor:pointer;
  }

  /* ============ CONVERSATION LIST COLUMN ============ */
  .list-col{
    width:326px;flex:0 0 326px;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  .creator-pill-wrap{padding:12px 14px 10px;border-bottom:1px solid var(--border);}
  .creator-pill{
    display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--border);border-radius:12px;
    background:var(--panel);width:100%;transition:.15s;box-shadow:var(--shadow-sm);
  }
  .creator-pill:hover{border-color:#CED8EC;background:#FCFDFF;}
  .creator-av{position:relative;flex:0 0 auto;}
  .creator-av .odot{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--success);border:2px solid #fff;}
  .creator-meta{flex:1;text-align:left;min-width:0;}
  .creator-meta .nm{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px;}
  .creator-meta .sub{font-size:11px;color:var(--success);font-weight:600;}
  .chev{color:var(--muted-2);flex:0 0 auto;}

  .search-wrap{padding:10px 14px;}
  .search-box{
    display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--border);border-radius:10px;
    padding:9px 12px;color:var(--muted-2);
  }
  .search-box input{border:none;background:none;outline:none;flex:1;font-size:13px;color:var(--heading);}

  .chips{display:flex;gap:6px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);
    background:var(--bg);border:1px solid var(--border);white-space:nowrap;transition:.14s;display:flex;align-items:center;gap:6px;
  }
  .chip:hover{border-color:#CED8EC;color:var(--heading);}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 10px rgba(47,107,255,.28);}
  .chip .cnt{background:rgba(255,255,255,.28);border-radius:9px;padding:0 5px;font-size:10.5px;}
  .chip:not(.active) .cnt{background:#E2E8F5;color:var(--muted);}

  .conv-list{flex:1;overflow-y:auto;min-height:0;padding:2px 8px 12px;}
  .conv-section{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted-2);padding:12px 8px 6px;}
  .conv{
    display:flex;gap:11px;padding:10px;border-radius:12px;cursor:pointer;transition:.13s;position:relative;align-items:flex-start;
  }
  .conv:hover{background:#F7F9FE;}
  .conv.active{background:var(--tint);}
  .conv.active::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--accent);}
  .conv-av{position:relative;flex:0 0 auto;}
  .conv-av .odot{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--success);border:2px solid #fff;}
  .conv-av .odot.off{background:#C4CBDA;}
  .conv-body{flex:1;min-width:0;}
  .conv-top{display:flex;align-items:center;gap:6px;}
  .conv-name{font-weight:600;font-size:13.5px;color:var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-time{margin-left:auto;font-size:11px;color:var(--muted-2);flex:0 0 auto;font-weight:500;}
  .conv.unread .conv-time{color:var(--accent);font-weight:600;}
  .conv-prev{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;}
  .conv.unread .conv-prev{color:var(--heading);font-weight:500;}
  .conv-tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center;}
  .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:3px;letter-spacing:.2px;}
  .tag.vip{background:#F3ECFF;color:var(--violet);}
  .tag.spend{background:var(--success-tint);color:#0E8F4F;}
  .tag.prio{background:var(--warning-tint);color:#B9770F;}
  .tag.new{background:var(--tint);color:var(--accent);}
  .unread-pill{
    margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:11px;background:var(--accent);color:#fff;
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 3px 8px rgba(47,107,255,.35);
  }

  /* ============ CENTER CONVERSATION PANE ============ */
  .center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel);}
  .conv-header{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border);
  }
  .ch-av{position:relative;flex:0 0 auto;}
  .ch-av .odot{position:absolute;bottom:0px;right:0px;width:12px;height:12px;border-radius:50%;background:var(--success);border:2.5px solid #fff;}
  .ch-meta{min-width:0;}
  .ch-name{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;}
  .ch-name .verified{color:var(--accent);}
  .ch-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-top:1px;}
  .ch-sub .live{display:inline-flex;align-items:center;gap:4px;color:var(--success);font-weight:600;}
  .ch-sub .live .d{width:6px;height:6px;border-radius:50%;background:var(--success);}
  .ch-actions{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .spend-chip{
    display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;background:var(--success-tint);
    color:#0E8F4F;font-weight:700;font-size:12.5px;border:1px solid #CFF0DE;
  }
  .ico-btn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    color:var(--muted);background:var(--panel);transition:.14s;
  }
  .ico-btn:hover{background:var(--bg);color:var(--heading);border-color:#CED8EC;}
  .ico-btn.on{background:var(--tint);color:var(--accent);border-color:#CBD9FB;}

  .thread{flex:1;overflow-y:auto;min-height:0;padding:20px 22px 8px;background:linear-gradient(180deg,#FBFCFE,#FFFFFF);display:flex;flex-direction:column;gap:3px;}
  .day-div{display:flex;align-items:center;gap:12px;margin:14px 0 10px;}
  .day-div::before,.day-div::after{content:"";flex:1;height:1px;background:var(--border);}
  .day-div span{font-size:11px;font-weight:600;color:var(--muted-2);background:#fff;padding:2px 10px;border-radius:20px;border:1px solid var(--border);}

  .msg{display:flex;flex-direction:column;max-width:64%;margin-bottom:9px;}
  .msg.in{align-self:flex-start;align-items:flex-start;}
  .msg.out{align-self:flex-end;align-items:flex-end;}
  .bubble{
    padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.5;word-wrap:break-word;box-shadow:var(--shadow-sm);
  }
  .msg.in .bubble{background:#EEF1F7;color:#1E2438;border-bottom-left-radius:5px;}
  .msg.out .bubble{background:linear-gradient(135deg,#2F6BFF,#3D74FF);color:#fff;border-bottom-right-radius:5px;}
  .msg-time{font-size:10.5px;color:var(--muted-2);margin-top:4px;padding:0 4px;display:flex;align-items:center;gap:5px;}
  .msg.out .msg-time .seen{color:var(--accent);display:inline-flex;align-items:center;gap:2px;}

  /* PPV card */
  .ppv{
    width:288px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.25);
  }
  .msg.out .ppv{border-bottom-right-radius:5px;}
  .ppv-media{
    height:168px;position:relative;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(120px 120px at 30% 25%, rgba(255,255,255,.25), transparent),
      linear-gradient(135deg,#F0518A,#8B5CF6 60%,#2F6BFF);
  }
  .ppv-media.locked::after{content:"";position:absolute;inset:0;backdrop-filter:blur(3px);background:rgba(18,23,43,.28);}
  .ppv-lock{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;}
  .ppv-lock .circle{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.4);}
  .ppv-lock .txt{font-size:12px;font-weight:600;opacity:.95;}
  .ppv-unlocked-badge{position:absolute;z-index:2;top:10px;left:10px;background:rgba(22,179,100,.95);color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;display:flex;align-items:center;gap:4px;}
  .ppv-count{position:absolute;z-index:2;bottom:10px;right:10px;background:rgba(18,23,43,.6);color:#fff;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;display:flex;align-items:center;gap:4px;}
  .ppv-foot{padding:10px 13px;background:#fff;display:flex;align-items:center;gap:10px;}
  .msg.out .ppv-foot{background:#EAF1FF;}
  .ppv-price{font-weight:800;font-size:15px;color:var(--heading);}
  .ppv-state{margin-left:auto;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
  .ppv-state.unlocked{background:var(--success-tint);color:#0E8F4F;}
  .ppv-state.locked{background:var(--warning-tint);color:#B9770F;}
  .ppv-caption{font-size:12px;color:var(--muted);margin-top:2px;}

  /* system / tip chip */
  .sys{align-self:center;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#E6F7EE,#F0FBF5);border:1px solid #CFF0DE;color:#0E8F4F;
    font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;margin:8px 0;box-shadow:var(--shadow-sm);}
  .sys.pin{background:var(--tint);border-color:#CBD9FB;color:var(--accent);}

  .typing{align-self:flex-start;display:flex;align-items:center;gap:5px;background:#EEF1F7;padding:11px 15px;border-radius:16px;border-bottom-left-radius:5px;margin-bottom:8px;}
  .typing i{width:6px;height:6px;border-radius:50%;background:#9AA3B8;animation:blink 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s;}
  .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-2px);}}

  /* Smart messages strip */
  .smart-strip{
    flex:0 0 auto;padding:11px 18px 3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    border-top:1px solid var(--border);background:var(--panel);
  }
  .smart-label{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--violet);}
  .smart-chip{
    padding:7px 13px;border-radius:20px;border:1px solid #DCD3FF;background:linear-gradient(135deg,#F7F4FF,#FDF6FF);
    font-size:12.5px;color:#4B3B8F;font-weight:500;transition:.14s;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .smart-chip:hover{border-color:var(--violet);box-shadow:0 4px 12px rgba(139,92,246,.18);transform:translateY(-1px);}

  /* Composer */
  .composer{flex:0 0 auto;padding:8px 18px 16px;background:var(--panel);}
  .composer-box{
    border:1px solid var(--border);border-radius:14px;background:var(--panel);box-shadow:var(--shadow-sm);transition:.15s;
  }
  .composer-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint);}
  .composer-input-row{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 4px;}
  .composer-input-row textarea{
    flex:1;border:none;outline:none;resize:none;background:none;font-size:13.5px;line-height:1.5;color:var(--heading);
    max-height:120px;min-height:24px;padding:4px 0;
  }
  .composer-toolbar{display:flex;align-items:center;gap:4px;padding:4px 10px 8px;}
  .cbtn{
    height:34px;padding:0 10px;border-radius:9px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:600;transition:.14s;
  }
  .cbtn:hover{background:var(--bg);color:var(--heading);}
  .cbtn.ppv{color:var(--success);}
  .cbtn.ppv:hover{background:var(--success-tint);}
  .cbtn.scripts{border:1px solid var(--border);}
  .composer-spacer{flex:1;}
  .send-btn{
    height:36px;padding:0 18px;border-radius:10px;background:linear-gradient(135deg,#2F6BFF,#3D74FF);color:#fff;font-weight:700;font-size:13px;
    display:flex;align-items:center;gap:7px;box-shadow:0 6px 16px rgba(47,107,255,.35);transition:.14s;
  }
  .send-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(47,107,255,.42);}

  /* ============ RIGHT CONTEXT PANEL ============ */
  .context{
    width:304px;flex:0 0 304px;background:var(--panel);border-left:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;overflow-y:auto;
  }
  .ctx-hero{padding:22px 20px 18px;text-align:center;border-bottom:1px solid var(--border);position:relative;}
  .ctx-close{position:absolute;top:12px;right:12px;}
  .ctx-hero .big-av{margin:0 auto 12px;position:relative;width:76px;height:76px;}
  .ctx-hero .big-av .odot{position:absolute;bottom:3px;right:3px;width:16px;height:16px;border-radius:50%;background:var(--success);border:3px solid #fff;}
  .ctx-name{font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:7px;}
  .ctx-user{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .ctx-subpill{display:inline-flex;align-items:center;gap:6px;margin-top:11px;padding:5px 13px;border-radius:20px;background:var(--tint);color:var(--accent);font-size:12px;font-weight:700;}
  .ctx-quick{display:flex;gap:8px;justify-content:center;margin-top:14px;}
  .ctx-quick .q{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.14s;}
  .ctx-quick .q:hover{background:var(--bg);color:var(--accent);border-color:#CBD9FB;}

  .ctx-sec{padding:16px 20px;border-bottom:1px solid var(--border);}
  .ctx-sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted-2);margin-bottom:12px;display:flex;align-items:center;gap:7px;}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .stat{border:1px solid var(--border);border-radius:11px;padding:11px 12px;background:#FBFCFE;}
  .stat .v{font-weight:800;font-size:17px;color:var(--heading);letter-spacing:-.3px;}
  .stat .v.green{color:#0E8F4F;}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500;}

<script>
/* ---------- avatar generator (inline SVG initials) ---------- */
const PALETTES = [
  ['#2F6BFF','#6A9BFF'],['#F0518A','#FF8FB3'],['#8B5CF6','#B794FF'],
  ['#16B364','#5FD69A'],['#F5A623','#FFC969'],['#0EA5B7','#4FD3E0'],
  ['#E0517A','#F59BBA'],['#5661E0','#8E97FF']
];
function palFor(seed){let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;return PALETTES[h%PALETTES.length];}
function initials(name){
  const clean=name.replace(/[^A-Za-z0-9_ ]/g,' ').replace(/_/g,' ').trim().split(/\s+/);
  if(clean.length===1)return clean[0].slice(0,2).toUpperCase();
  return (clean[0][0]+clean[1][0]).toUpperCase();
}
function avatar(name,size,fs){
  const [a,b]=palFor(name);const id='g'+Math.random().toString(36).slice(2,8);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="border-radius:50%;display:block">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>
    <rect width="${size}" height="${size}" rx="${size/2}" fill="url(#${id})"/>
    <text class="av-txt" x="50%" y="50%" dy=".02em" font-size="${fs}" text-anchor="middle" dominant-baseline="central" font-family="Inter">${initials(name)}</text>
  </svg>`;
}

const ORDER = ["jenna","mike","sofia","david","brandon","mia","tyler","lena"];
let activeKey = "jenna";

/* ---------- render conversation list ---------- */
function tagChips(c){
  let h="";
  if(c.vip) h+=`<span class="tag vip"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>VIP</span>`;
  if(c.spender) h+=`<span class="tag spend">$ Spender</span>`;
  if(c.priority) h+=`<span class="tag prio">Priority</span>`;
  if(c.sub && /days|wk|9 days/.test(c.sub)) h+=`<span class="tag new">New</span>`;
  return h;
}
function renderList(){
  const el=document.getElementById("convList");
  let html=`<div class="conv-section">Pinned</div>`;
  const pinned=["jenna","mike"];
  const rest=ORDER.filter(k=>!pinned.includes(k));
  const row=(k)=>{
    const c=CONVOS[k];
    return `<div class="conv ${k===activeKey?'active':''} ${c.unread?'unread':''}" data-key="${k}" onclick="selectConv('${k}')">
      <span class="conv-av">${avatar(c.name,42,15)}<span class="odot ${c.online_dot?'':'off'}"></span></span>
      <div class="conv-body">
        <div class="conv-top">
          <span class="conv-name">${c.name}</span>
          <span class="conv-time">${c.time}</span>
        </div>
        <div class="conv-prev">${c.prev}</div>
        <div class="conv-tags">
          ${tagChips(c)}
          ${c.unread?`<span class="unread-pill">${c.unread}</span>`:''}
        </div>
      </div>
    </div>`;
  };
  html+=pinned.map(row).join("");
  html+=`<div class="conv-section">All messages</div>`;
  html+=rest.map(row).join("");
  el.innerHTML=html;
}

/* ---------- render thread ---------- */
function msgHTML(m){
  if(m.t==="day") return `<div class="day-div"><span>${m.v}</span></div>`;
  if(m.t==="sys") return `<div class="sys"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>${m.v}</div>`;
  if(m.t==="tip") return `<div class="sys"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6"/><path d="M2 8h20v4H2z"/><path d="M12 22V8"/><path d="M12 8a3 3 0 1 0-3-3c0 1.5 1 3 3 3zM12 8a3 3 0 1 1 3-3c0 1.5-1 3-3 3z"/></svg>${m.v}</div>`;
  if(m.t==="typing") return `<div class="typing"><i></i><i></i><i></i></div>`;
  if(m.t==="ppv"){
    const lockedCls=m.locked?'locked':'';
    const media=m.locked
      ? `<div class="ppv-media ${lockedCls}"><div class="ppv-lock"><span class="circle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><span class="txt">Locked · tap to unlock</span></div><span class="ppv-count"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 3l14 9-14 9z"/></svg>${m.count}</span></div>`
      : `<div class="ppv-media"><span class="ppv-unlocked-badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>Unlocked</span><div class="ppv-lock"><span class="circle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V6a4 4 0 0 1 7-2.6"/></svg></span></div><span class="ppv-count"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 3l14 9-14 9z"/></svg>${m.count}</span></div>`;
    return `<div class="msg ${m.dir}">
      <div class="ppv">
        ${media}
        <div class="ppv-foot">
          <span class="ppv-price">${m.price}</span>
          <span class="ppv-state ${m.locked?'locked':'unlocked'}">${m.state}</span>
        </div>
      </div>
      <div class="ppv-caption">${m.caption}</div>
      <div class="msg-time">${m.time}${m.dir==='out'?` · <span class="seen"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m2 12 5 5L18 6"/><path d="m11 15 1 1L22 6"/></svg>Seen</span>`:''}</div>
    </div>`;
  }
  // regular in/out
  const seen = m.t==="out" && m.seen ? ` · <span class="seen"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m2 12 5 5L18 6"/><path d="m11 15 1 1L22 6"/></svg>Seen</span>` : "";
  return `<div class="msg ${m.t}"><div class="bubble">${m.v}</div><div class="msg-time">${m.time||''}${seen}</div></div>`;
}

function renderThread(c){
  const el=document.getElementById("thread");
  el.innerHTML=c.messages.map(msgHTML).join("");
  el.scrollTop=el.scrollHeight;
}

/* ---------- render smart strip ---------- */
function renderSmart(c){
  const el=document.getElementById("smartStrip");
  const label=el.querySelector(".smart-label");
  el.innerHTML="";
  el.appendChild(label);
  c.smart.forEach(s=>{
    const b=document.createElement("button");
    b.className="smart-chip";
    b.textContent=s;
    b.onclick=()=>{document.getElementById("composerInput").value=s.replace(/[🚿🙈😏🎥🎬🎁🐶🎀🎙️👑❤️💕]/g,'').trim();document.getElementById("composerInput").focus();};
    el.appendChild(b);
  });
}

/* ---------- render context panel ---------- */
function renderContext(c){
  document.getElementById("ctxAv").innerHTML=avatar(c.name,76,26)+`<span class="odot" style="${c.online_dot?'':'background:#C4CBDA'}"></span>`;
  document.getElementById("ctxName").textContent=c.name;
  document.getElementById("ctxUser").textContent=c.user;
  document.getElementById("ctxSub").textContent=c.sub;
  document.getElementById("statsGrid").innerHTML=c.stats.map(s=>`<div class="stat"><div class="v ${s[2]}">${s[0]}</div><div class="l">${s[1]}</div></div>`).join("");
  document.getElementById("ctxNote").value=c.note;
  document.getElementById("listTags").innerHTML=c.lists.map(l=>`<span class="list-tag"><span class="d" style="background:${l[1]}"></span>${l[0]}</span>`).join("")+`<span class="list-tag add"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</span>`;
  document.getElementById("purchases").innerHTML=c.purchases.map(p=>{
    const ic=p[0]==="tip"
      ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`
      : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>`;
    return `<div class="purchase"><span class="pi ${p[0]}">${ic}</span><div class="pb"><div class="pt">${p[1]}</div><div class="pw">${p[2]}</div></div><span class="pa">${p[3]}</span></div>`;
  }).join("");
}

/* ---------- render header ---------- */
function renderHeader(c){
  document.getElementById("chAv").innerHTML=avatar(c.name,44,15)+(c.online?'<span class="odot"></span>':'');
  document.getElementById("chName").textContent=c.name;
  document.getElementById("chUser").textContent=c.user;
  document.getElementById("chLifetime").textContent=c.lifetime;
  document.getElementById("crumbFan").textContent=c.name;
  const live=document.getElementById("chLive");
  live.innerHTML=c.online?`<span class="d"></span> ${c.live}`:c.live;
  live.className=c.online?"live":"";
  live.style.color=c.online?"":"var(--muted-2)";
}

/* ---------- select conversation ---------- */
function selectConv(key){
  activeKey=key;
  const c=CONVOS[key];
  document.querySelectorAll(".conv").forEach(el=>el.classList.toggle("active",el.dataset.key===key));
  renderHeader(c);
  renderThread(c);
  renderSmart(c);
  renderContext(c);
}

/* ---------- interactions ---------- */
document.getElementById("chips").addEventListener("click",e=>{
  const chip=e.target.closest(".chip");if(!chip)return;
  document.querySelectorAll("#chips .chip").forEach(c=>c.classList.remove("active"));
  chip.classList.add("active");
});
document.getElementById("railNav").addEventListener("click",e=>{
  const item=e.target.closest(".nav-item");if(!item)return;
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  item.classList.add("active");
});
document.getElementById("ctxToggle").addEventListener("click",()=>document.getElementById("context").classList.toggle("open"));
document.getElementById("ctxClose").addEventListener("click",()=>document.getElementById("context").classList.remove("open"));

const ci=document.getElementById("composerInput");
ci.addEventListener("input",()=>{ci.style.height="auto";ci.style.height=Math.min(ci.scrollHeight,120)+"px";});

function doSend(){
  const val=ci.value.trim();if(!val)return;
  const c=CONVOS[activeKey];
  // strip the typing indicator if present
  c.messages=c.messages.filter(m=>m.t!=="typing");
  c.messages.push({t:"out",v:val,time:"now",seen:false});
  ci.value="";ci.style.height="auto";
  renderThread(c);
}
document.getElementById("sendBtn").addEventListener("click",doSend);
ci.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSend();}});

/* ---------- init ---------- */
document.getElementById("creatorAv").innerHTML=avatar("Aria Vixen",38,13)+'<span class="odot"></span>';
renderList();
selectConv("jenna");
